# ArgoCD Application: kube-prometheus-stack (Prometheus + Grafana + Alertmanager)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 61.0.0
      helm:
        releaseName: prometheus-stack
        valueFiles:
          - $values/gitops/apps/prometheus-stack/values.yaml
    - repoURL: https://github.com/yashasbn/velora.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # CRDs for kube-prometheus-stack are large — replace rather than patch
      - Replace=true
