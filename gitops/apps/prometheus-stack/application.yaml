# ArgoCD Application: kube-prometheus-stack (Prometheus + Grafana + Alertmanager)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_USERNAME/velora
    targetRevision: HEAD
    path: gitops/apps/prometheus-stack
    helm:
      releaseName: prometheus-stack
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # CRDs for kube-prometheus-stack are large — replace rather than patch
      - Replace=true
