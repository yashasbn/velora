# Grafana dashboard ConfigMap
# Grafana's sidecar picks this up automatically because of the
# grafana_dashboard: "1" label set in the prometheus-stack values.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: velora-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  velora-dashboard.json: |
    {
      "__inputs": [],
      "__requires": [
        { "type": "grafana", "id": "grafana", "name": "Grafana", "version": "10.0.0" },
        { "type": "datasource", "id": "prometheus", "name": "Prometheus", "version": "1.0.0" }
      ],
      "annotations": { "list": [] },
      "description": "Velora Operator — DataPipeline health, run metrics, and reconcile performance",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Active Pipelines",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "count(velora_datapipeline_ready)", "legendFormat": "Total" }],
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "blue", "value": 0 }] } } }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Ready Pipelines",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(velora_datapipeline_ready == 1)", "legendFormat": "Ready" }],
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 1 }] } } }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Unready Pipelines",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum(velora_datapipeline_ready == 0) or vector(0)", "legendFormat": "Unready" }],
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 1 }] } } }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Reconcile Error Rate",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "rate(velora_operator_reconcile_errors_total[5m])", "legendFormat": "err/s" }],
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 0.05 }, { "color": "red", "value": 0.1 }] } } }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Pipeline Success vs Failure Rate",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "rate(velora_datapipeline_failures_total[5m])", "legendFormat": "failures/s — {{pipeline}}" }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "options": { "tooltip": { "mode": "multi" } },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "reqps" } }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Reconcile Duration (p50 / p95)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "histogram_quantile(0.50, rate(velora_operator_reconcile_duration_seconds_bucket[5m]))", "legendFormat": "p50" },
            { "expr": "histogram_quantile(0.95, rate(velora_operator_reconcile_duration_seconds_bucket[5m]))", "legendFormat": "p95" }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Reconcile Total Rate",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "rate(velora_operator_reconcile_total[5m])", "legendFormat": "reconciles/s" }
          ],
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 12 },
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "MinIO Bucket Provisioning",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "increase(velora_minio_bucket_provision_total{result='success'}[1h])", "legendFormat": "success" },
            { "expr": "increase(velora_minio_bucket_provision_total{result='failure'}[1h])", "legendFormat": "failure" }
          ],
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 12 },
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 9,
          "type": "table",
          "title": "Pipeline Status Overview",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "velora_datapipeline_ready", "legendFormat": "{{pipeline}} ({{namespace}})", "instant": true, "format": "table" }
          ],
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 12 },
          "transformations": [
            { "id": "organize", "options": { "renameByName": { "Value": "Ready (1=yes)", "pipeline": "Pipeline", "namespace": "Namespace" } } }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "tags": ["velora", "datapipeline", "operator"],
      "templating": { "list": [] },
      "time": { "from": "now-3h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Velora — DataPipeline Operations",
      "uid": "velora-datapipeline-ops",
      "version": 1
    }
