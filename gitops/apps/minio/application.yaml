# ArgoCD Application: MinIO
# Managed by the velora-apps App-of-Apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_USERNAME/velora
    targetRevision: HEAD
    path: gitops/apps/minio
    helm:
      releaseName: minio
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: minio

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
