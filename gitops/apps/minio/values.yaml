# Official MinIO Helm values for Velora (kind/local)
# Chart: minio/minio (from https://charts.min.io/)
#
# Switched from bitnami/minio because Bitnami removed versioned image
# tags from public Docker Hub (Aug 2025). The official chart uses
# minio/minio images directly from Docker Hub which remain available.
#
# The Velora operator provisions buckets via the MinIO S3 API
# using the credentials in this secret.

mode: standalone

image:
  repository: minio/minio
  tag: latest
  pullPolicy: IfNotPresent

rootUser: velora
rootPassword: velora-minio-secret   # Override via Secret in production

replicas: 1
drivesPerNode: 1

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""   # Uses the default StorageClass (kind provides standard)

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: NodePort
  port: 9000
  nodePort: 30090

consoleService:
  type: NodePort
  port: 9001
  nodePort: 30091

# Default buckets created at startup
buckets:
  - name: velora-artifacts
    policy: none
    purge: false
  - name: velora-logs
    policy: none
    purge: false

# Metrics endpoint for Prometheus scraping
metrics:
  serviceMonitor:
    enabled: true
    namespace: monitoring
